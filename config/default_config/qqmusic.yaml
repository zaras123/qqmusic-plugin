# QQ 音乐 API 地址（qqmusic-api-enhanced）
apiBase: http://127.0.0.1:3300

# API Token（与 API 端配置的 Token 一致）
apiToken: ""

# 功能开关
enable: true
enableSongRequest: true
enableResolve: true

# 点歌
maxList: 10
quality: "auto"
qualityFallback: true

# 发送方式
sendNativeCard: false
sendCustomCard: false
sendVocal: true
disableHighQualityVocal: false   # 禁用高清语音：PC QQ 播放不了高清语音时开启（改发 mono16k 低音质语音）
uploadFile: true
sendTextInfo: true
tempDir: temp/qqmusic-plugin
downloadTimeout: 90000
keepFileSec: 60

# 解析触发
resolveLinks: true
resolveCards: true

# 点歌结果渲染为图片卡片
renderListCard: true

# 其它平台补充曲（默认开）：QQ 音乐没版权的歌，从网易云/酷我补几条免费曲（128k）追加在列表尾部
extraSources: true

# 接管无前缀「#点歌」（默认关）：开启后本插件响应不加 #qqm 前缀的点歌命令
defaultPickSong: false

# 前缀提示
identifyPrefix: "识别："

# 扫码登录
qrLoginEnable: true

# 主人账号（QQ 号，配置键 publicAccount）：群友自己没登录时，点歌回落到这个已登录的账号
# （通常就是主人的 VIP 号）。留空 = 不启用（默认）。填了之后，没登录的群友点歌也走这个号的
# 登录态 —— 即全群都能播 VIP 曲。只影响「播歌/取数据」；登录状态、取 CK、刷新这些仍只看请求者本人。
publicAccount: ""

# 一律走主人账号（默认开）：所有人点歌都按主人账号（主人的 ck）取播放链，
# 不再看请求者自己有没有登录过 —— 群友在自己机器人上扫码登录过也不影响。
# 登录状态/收藏/刷新仍按请求者本人。需先配置 publicAccount（主人账号）才生效，
# 没配时开关等于没开（日志会提示一次）；不想全员走主人号可在锅巴关闭。
forceMasterAccount: true
