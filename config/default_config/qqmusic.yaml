# QQ 音乐 API 地址（qqmusic-api-enhanced）
apiBase: http://127.0.0.1:3300

# API Token（与 API 端配置的 Token 一致）
apiToken: ""

# 功能开关
enable: true
enableSongRequest: true
enableResolve: true

# 点歌
maxList: 10
quality: "auto"
qualityFallback: true

# 发送方式
sendNativeCard: false
sendCustomCard: false
sendVocal: true
disableHighQualityVocal: false   # 禁用高清语音：PC QQ 播放不了高清语音时开启（改发 mono16k 低音质语音）
uploadFile: true
sendTextInfo: true
tempDir: temp/qqmusic-plugin
downloadTimeout: 90000
keepFileSec: 60

# 解析触发
resolveLinks: true
resolveCards: true

# 点歌结果渲染为图片卡片
renderListCard: true

# ————— 界面（多套 UI）—————
# 卡片主题：resources/themes/ 下的目录名（内置 classic / apple / nebula / multi，丢个目录就能加自己的）
#   nebula「星云·鎏光」与 multi「多平台」是 2.0 专版，2.0 里由下面的 uiThemeV2 决定用哪套
# 换主题、改模板文件都是**热更新**，不用重启机器人
uiTheme: classic
# 深色：只对声明支持深色的主题生效（apple 支持，classic 不支持）
#   false = 浅色 / true = 深色 / auto = 跟随时间（夜晚 20:00-5:00 自动切深色）
uiDark: false

# 2.0（？？？打开后）用的卡片主题：默认 nebula「星云 · 鎏光」——
#   液态玻璃材质（折射边 + 扫光 + 极光底）+ 香槟金烫字，2.0 的"门面"就是它。
#   想换：multi「多平台」（每首歌带来源色标）/ classic / apple 都行。
uiThemeV2: nebula
# 底色随时段自动换：清晨 5-8 / 白天 8-17 / 黄昏 17-20 / 夜晚 20-5（声明了时段配色的主题才生效）
uiTimeColor: true
# 自定义背景（apple / nebula / multi 支持，classic 忽略）：开启后卡片切成 iOS 液态玻璃
uiBgEnable: false
# 背景来源，自动识别三种：
#   本地路径  D:\图片\a.jpg   或  /root/pics/a.jpg
#   图片直链  https://example.com/a.jpg
#   图片 API  https://api.example.com/random   （返回 JSON 里有图片地址，或直接返回图片）
uiBgValue: ""
# 远端背景缓存分钟数；0 = 每次渲染都重新取（要随机图 API 换得勤就填 0）
uiBgCacheMin: 10

# 其它平台补充曲（默认开）：QQ 音乐没版权的歌，从网易云/酷我补几条免费曲（128k）追加在列表尾部
extraSources: true

# QQ 音乐音源开关（默认开）。关掉后这个机器人**只用其它平台**：
#   #qqm点歌 → 直接搜「？？？」里开着的那几家免费曲（QQ 账号相关功能随之用不上）
# 背景：QQ 只是**其中一家**音源，不是唯一主干 —— 别人开了别的平台就能拿它点歌、补列表。
qqEnabled: true

# 接管无前缀「#点歌」（默认关）：开启后本插件响应不加 #qqm 前缀的点歌命令
defaultPickSong: false

# 前缀提示
identifyPrefix: "识别："

# ————— ？？？（默认关）—————
# 就是这个键：锅巴里显示成「？？？」。打开后下面那段才生效：
#   · 多平台点歌（#qqm网易云点歌 / #qqmB站点歌 …）+ 新版帮助 UI
#   · 锅巴里多出「音源平台」分组
# 关着时与 1.x **完全一致**：那些命令不响应、帮助还是老那张图。
# ⚠️ 建议只在锅巴里改（手改本文件后要重启机器人）。
unlockV2: false

# 各音源平台开关（锅巴 → 音源平台；仅在 ？？？ 打开后可见）
#   缺省 = 全开；`enabled: false` 关掉某家；`maxList` 留空 = 用上面的点歌列表数量
platforms: {}

# 扫码登录
qrLoginEnable: true

# 主人账号（配置键 publicAccount）：群友自己没登录时，点歌回落到这个已登录的账号
# （通常就是主人的 VIP 号）。留空 = 自动取最近一次扫码登录的账号（默认，一般无需手填），
# 多账号想固定用某一个时才手动填。只影响「播歌/取数据」；登录状态、取 CK、刷新这些仍只看请求者本人。
publicAccount: ""

# 一律走主人账号（默认开）：所有人点歌都按主人账号（主人的 ck）取播放链，
# 不再看请求者自己有没有登录过 —— 群友在自己机器人上扫码登录过也不影响。
# 主人账号自动取最近扫码登录的账号，机器人扫码登录过即自动生效；
# 登录状态/收藏/刷新仍按请求者本人。不想全员走主人号可在锅巴关闭。
forceMasterAccount: true

# ————— 一起听（群听歌）—————
# ⚠️ 未维护，请勿开启（2026-09-21）
#   加歌这条链在 icqq 协议端下走不通：服务端对 share_trans（写操作）一律回
#   `10003 tmem error`，而同一个账号在真 QQ 客户端里能正常加歌（只读的
#   「#qqm一起听 状态」是好的）。包体/顺序/参数/账号/成员权限/签名都排查过，
#   差异只在 icqq 自己拼的 SSO 信封上 —— 应用层改不动。
#   等接了 NTQQ 系协议端（NapCat / SnowLuma，走真内核）验证通过再开。
# 插件这里只有开关：包怎么拼、是否开房、限流、失败文案都在 API 侧
# （qqmusic-api-enhanced 的 util/together.js + data/together.json）。
togetherEnable: false
# 自动同步：点歌（#qqm听N / #qqm播放 / 解析卡片等所有发歌路径）成功后再把这首歌加进一起听
# ⚠️ 同上：依赖加歌链路，未维护，勿开
togetherAuto: false
